<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Learn With Me</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">

    <!-- Channel Logo -->
    <img
      src="logo.png"
      alt="Something Learn With Me Logo"
      class="logo"
    >

    <h1>Welcome to Something Learn With Me</h1>

    <p class="intro">
      I'm learning, building projects, and sharing my journey with technology.
    </p>

    <section>
      <h2>About Me</h2>

      <p>
        I'm a student interested in programming, web development,
        GitHub, AI and emerging technologies.
      </p>
    </section>

    <section>
      <h2>My Skills</h2>

      <div class="skills">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
        <span>GitHub</span>
      </div>
    </section>

    <div class="buttons">

      <a
        href="https://github.com/sethumadhavan505"
        target="_blank"
      >
        GitHub
      </a>

      <a
        href="https://www.youtube.com/@somethinglearnwithme"
        target="_blank"
        class="youtube-btn"
      >
        ▶ Subscribe on YouTube
      </a>

      <button id="messageBtn">
        Say Hello
      </button>

    </div>

    <p id="message"></p>

  </main>

  <script src="script.js"></script>

</body>
</html>
